name: Keep Render backend warm

on:
  schedule:
    # Render's free tier spins a service down after ~15 minutes idle; every
    # 10 minutes keeps it from ever hitting that threshold. GitHub only
    # guarantees "best effort" timing on schedules (can slip a few minutes
    # under load), which is fine for this - it just needs to land sometime
    # before the 15-minute window closes.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS "${{ secrets.RENDER_BACKEND_URL }}/health"
